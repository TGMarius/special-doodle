name: Mirror Images to GHCR (Org Style)

on:
  push:
    paths:
      - images.txt
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GHCR_PAT }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Mirror all images from images.txt (org-style)
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting org-style mirroring"
          echo "----"

          while IFS= read -r RAW_LINE || [ -n "$RAW_LINE" ]; do
            echo "RAW LINE: '$RAW_LINE'"

            # Strip comments + whitespace
            IMAGE_REF="$(echo "$RAW_LINE" | sed 's/#.*//g' | tr -d '[:space:]')"

            [ -z "$IMAGE_REF" ] && echo "Skipping blank line" && continue

            echo "Pulling $IMAGE_REF..."
            docker pull "$IMAGE_REF"

            # Extract repo path (without registry and tag)
            IMAGE_NO_TAG="${IMAGE_REF%%:*}"

            if [[ "$IMAGE_NO_TAG" == */* ]]; then
              IMAGE_PATH="${IMAGE_NO_TAG#*/}"
            else
              IMAGE_PATH="$IMAGE_NO_TAG"
            fi

            # Get immutable digest
            DIGEST="$(docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "$IMAGE_REF")"

            SHA="${DIGEST##*@sha256:}"

            if [ -z "$SHA" ]; then
              echo "ERROR: Failed to resolve digest for $IMAGE_REF"
              exit 1
            fi

            DEST="ghcr.io/tgmarius/mirror/${IMAGE_PATH}:${SHA}"

            echo "Tagging as $DEST..."
            docker tag "$IMAGE_REF" "$DEST"

            echo "Pushing to GHCR..."
            docker push "$DEST"

            echo "Done processing $IMAGE_REF"
            echo "----"

          done < images.txt

          echo "Mirroring complete!"
