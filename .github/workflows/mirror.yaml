name: Mirror Images to GHCR

on:
  push:
    paths:
      - "images.txt"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Mirror all images
        run: |
          while read SRC; do
            [ -z "$SRC" ] && continue

            IMAGE_WITH_TAG=$(echo "$SRC" | awk -F/ '{print $NF}')
            NAME=$(echo "$IMAGE_WITH_TAG" | cut -d: -f1)
            TAG=$(echo "$IMAGE_WITH_TAG" | awk -F: '{print $2}')
            [ -z "$TAG" ] && TAG="latest"
            EST="ghcr.io/${{ github.repository_owner }}/mirror/${NAME}:${TAG}"

            echo "Mirroring $SRC → $DEST"

            docker pull "$SRC"
            docker tag "$SRC" "$DEST"
            docker push "$DEST"
          done < images.txt
