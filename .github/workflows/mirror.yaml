- name: Mirror images per environment
        shell: bash
        run: |
          set -e

          echo "Detecting changed image files..."

          if [ -z "${{ github.event.before }}" ]; then
            echo "No 'before' SHA detected; using last commit range."
            CHANGED_FILES="$(git diff --name-only HEAD^ HEAD || true)"
          else
            CHANGED_FILES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          for FILE in $CHANGED_FILES; do
            if [[ "$FILE" != images/*.txt ]]; then
              continue
            fi

            ENVIRONMENT="$(basename "$FILE" .txt)"
            echo ""
            echo "======================================"
            echo "Processing environment: $ENVIRONMENT"
            echo "Image file: $FILE"
            echo "======================================"

            while IFS= read -r SRC || [ -n "$SRC" ]; do

              RAW_LINE="$SRC"
              CLEANED="$(echo "$RAW_LINE" | tr -d '[:space:]')"

              if [ -z "$CLEANED" ]; then
                continue
              fi

              IMAGE_REF="$(echo "$RAW_LINE" | sed 's/#.*//g' | tr -d '[:space:]')"
              IMAGE_WITH_TAG="$(echo "$IMAGE_REF" | awk -F/ '{print $NF}')"
              NAME="$(echo "$IMAGE_WITH_TAG" | cut -d: -f1)"

              if [[ "$IMAGE_WITH_TAG" == *:* ]]; then
                TAG="$(echo "$IMAGE_WITH_TAG" | cut -d: -f2)"
              else
                TAG="latest"
              fi

              TAG="$(echo "$TAG" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

              if [ -z "$NAME" ] || [ -z "$TAG" ]; then
                echo "ERROR: Invalid image reference: $RAW_LINE"
                exit 1
              fi

              IS_FLOATING=false
              if [[ "$TAG" =~ ^latest$|^stable$|^prod$|^main$ ]]; then
                IS_FLOATING=true
              fi
              if [[ "$TAG" =~ ^[0-9]+$ ]]; then
                IS_FLOATING=true
              fi
              if [[ "$TAG" =~ ^[0-9]+- ]]; then
                IS_FLOATING=true
              fi

              if [ "$IS_FLOATING" = true ]; then
                echo "::warning title=Floating tag detected::[$ENVIRONMENT] Image '$IMAGE_REF' uses floating tag ('$TAG')."
              fi

              DEST="ghcr.io/tgmarius/${ENVIRONMENT}/${NAME}:${TAG}"

              docker pull "$IMAGE_REF"
              docker tag "$IMAGE_REF" "$DEST"
              docker push "$DEST"

            done < "$FILE"
          done

          echo "Mirroring complete."
