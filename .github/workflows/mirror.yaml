name: Mirror public images into private GHCR


on:
  push:
    branches: [main]
    paths: [images.txt]
  pull_request:
    paths: [images.txt]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GHCR_PAT }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin


      - name: Mirror images to GHCR (private or dry-run)
        shell: bash
        run: |
          echo "Starting org-style mirroring"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Dry run: not pushing images, just simulating."
            DRY_RUN=1 ./scripts/image-mirroring.sh
          else
            ./scripts/image-mirroring.sh
          fi
