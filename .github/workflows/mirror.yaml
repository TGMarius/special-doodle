name: Mirror public images into private GHCR

on:
  push:
    paths:
      - images.txt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GHCR_PAT }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Mirror images to GHCR (private)
        shell: bash
        run: |
          echo "Starting org-style mirroring"
          ./scripts/image-mirroring.sh
