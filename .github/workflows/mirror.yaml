- name: Mirror all images from images.txt
  run: |
    while IFS= read -r SRC || [ -n "$SRC" ]; do

      echo "----"
      echo "RAW LINE: '$SRC'"

      # Skip blank or whitespace-only lines
      CLEANED="$(echo "$SRC" | tr -d '[:space:]')"
      if [ -z "$CLEANED" ]; then
        echo "Skipping empty/blank line"
        continue
      fi

      # Extract only image name with tag (last path piece)
      IMAGE_WITH_TAG=$(echo "$SRC" | awk -F/ '{print $NF}')
      echo "IMAGE_WITH_TAG: '$IMAGE_WITH_TAG'"

      # NAME = text before ":" 
      NAME=$(echo "$IMAGE_WITH_TAG" | cut -d: -f1)
      echo "NAME: '$NAME'"

      # TAG = text after ":" (or latest)
      if echo "$IMAGE_WITH_TAG" | grep -q ":"; then
        TAG=$(echo "$IMAGE_WITH_TAG" | cut -d: -f2)
      else
        TAG="latest"
      fi
      echo "TAG: '$TAG'"

      # Build destination
      DEST="ghcr.io/${{ github.repository_owner }}/mirror/${NAME}:${TAG}"
      echo "DEST: '$DEST'"

      # Validate before pulling
      if [ -z "$NAME" ] || [ -z "$TAG" ]; then
        echo "ERROR: NAME or TAG is empty — skipping"
        continue
      fi

      echo "Mirroring $SRC → $DEST"

      docker pull "$SRC"
      docker tag "$SRC" "$DEST"
      docker push "$DEST"

    done < images.txt