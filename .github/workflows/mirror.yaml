name: Mirror public images into private GHCR

on:
  push:
    paths:
      - images.txt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GHCR_PAT }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Mirror images to GHCR (private)
        shell: bash
        run: |
          set -euo pipefail

          ORG="tgmarius"
          PREFIX="mirror"

          echo "Starting GHCR mirroring"
          echo "----"

          while IFS= read -r RAW_LINE || [ -n "$RAW_LINE" ]; do
            IMAGE="$(echo "$RAW_LINE" | sed 's/#.*//g' | tr -d '[:space:]')"
            [ -z "$IMAGE" ] && continue

            echo "Processing: $IMAGE"

            # Split image and tag
            IMAGE_NAME="${IMAGE%%:*}"
            TAG="${IMAGE##*:}"

            # Remove registry if present
            if [[ "$IMAGE_NAME" == */* ]]; then
              IMAGE_PATH="${IMAGE_NAME#*/}"
            else
              IMAGE_PATH="$IMAGE_NAME"
            fi

            DEST="ghcr.io/${ORG}/${PREFIX}/${IMAGE_PATH}:${TAG}"

            echo "→ Mirroring to $DEST"

            docker buildx imagetools create \
              --tag "$DEST" \
              "$IMAGE"

            echo "Done"
            echo "----"

          done < images.txt

          echo "All images mirrored successfully"
