name: Mirror Images to GHCR

on:
  push:
    paths:
      - "images.txt"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to GHCR
      run: |
        echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
          -u "${{ github.actor }}" --password-stdin

    - name: Mirror all images from images.txt
      shell: bash
      run: |
        echo "Starting mirroring"
        echo "----"

        while IFS= read -r SRC || [ -n "$SRC" ]; do

          echo "RAW LINE: '$SRC'"

          # Skip empty or whitespace-only lines
          CLEANED="$(echo "$SRC" | tr -d '[:space:]')"
          if [ -z "$CLEANED" ]; then
            echo "Skipping blank line"
            continue
          fi

          # Extract last segment: "nginx:latest"
          IMAGE_WITH_TAG=$(echo "$SRC" | awk -F/ '{print $NF}')
          echo "IMAGE_WITH_TAG: '$IMAGE_WITH_TAG'"

          # Extract NAME (before :)
          NAME=$(echo "$IMAGE_WITH_TAG" | cut -d: -f1)
          echo "NAME: '$NAME'"

          # Extract TAG (after :), default to latest
          if [[ "$IMAGE_WITH_TAG" == *:* ]]; then
            TAG=$(echo "$IMAGE_WITH_TAG" | cut -d: -f2)
          else
            TAG="latest"
          fi
          echo "TAG: '$TAG'"

          # Validate name/tag
          if [ -z "$NAME" ] || [ -z "$TAG" ]; then
            echo "ERROR: NAME or TAG empty. Skipping."
            continue
          fi

          DEST="ghcr.io/${{ github.repository_owner }}/mirror/${NAME}:${TAG}"
          echo "DEST: '$DEST'"

          echo "Pulling $SRC..."
          docker pull "$SRC"

          echo "Tagging as $DEST..."
          docker tag "$SRC" "$DEST"

          echo "Pushing to GHCR..."
          docker push "$DEST"

          echo "Done processing $SRC"
          echo "----"

        done < images.txt

        echo "Mirroring complete!"
