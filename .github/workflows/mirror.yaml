name: Mirror public images into private GHCR

on:
  push:
    branches:
      - main
    paths:
      - images.txt
  pull_request:
    paths:
      - images.txt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional but recommended: increases Docker Hub limits
      # Uncomment if you hit rate limits often
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ##
      ## DRY RUN (PR)
      ##
      - name: Dry-run mirroring (PR)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Running DRY RUN for PR"
          # Higher concurrency is fine since we don't push
          CONCURRENCY=6 PUSH=0 ./scripts/image-mirroring.sh

      ##
      ## REAL MIRROR (MAIN)
      ##
      - name: Mirror images into GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "Running REAL mirror (push)"
          # Lower concurrency to avoid rate limits
          CONCURRENCY=3 PUSH=1 ./scripts/image-mirroring.sh
