name: Mirror Images to GHCR

on:
  push:
    paths:
      - images.txt
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GHCR_PAT }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Mirror all images from images.txt
        shell: bash
        run: |
          echo "Starting mirroring"
          echo "----"

          while IFS= read -r SRC || [ -n "$SRC" ]; do

            RAW_LINE="$SRC"
            echo "RAW LINE: '$RAW_LINE'"

            # Skip empty or whitespace-only lines
            CLEANED="$(echo "$RAW_LINE" | tr -d '[:space:]')"
            if [ -z "$CLEANED" ]; then
              echo "Skipping blank line"
              continue
            fi

            # Strip inline comments for parsing
            IMAGE_REF="$(echo "$RAW_LINE" | sed 's/#.*//g' | tr -d '[:space:]')"

            # Extract last segment (e.g. nginx:latest)
            IMAGE_WITH_TAG="$(echo "$IMAGE_REF" | awk -F/ '{print $NF}')"
            NAME="$(echo "$IMAGE_WITH_TAG" | cut -d: -f1)"

            if [[ "$IMAGE_WITH_TAG" == *:* ]]; then
              TAG="$(echo "$IMAGE_WITH_TAG" | cut -d: -f2)"
            else
              TAG="latest"
            fi

            if [ -z "$NAME" ] || [ -z "$TAG" ]; then
              echo "ERROR: Invalid image reference: $RAW_LINE"
              exit 1
            fi

            # -------------------------------
            # Floating tag detection (WARN ONLY)
            # -------------------------------
            IS_FLOATING=false

            # Common floating tags
            if [[ "$TAG" =~ ^latest$|^stable$|^prod$|^main$ ]]; then
              IS_FLOATING=true
            fi

            # Major-only versions like "7"
            if [[ "$TAG" =~ ^[0-9]+$ ]]; then
              IS_FLOATING=true
            fi

            # Major + suffix like "7-alpine"
            if [[ "$TAG" =~ ^[0-9]+- ]]; then
              IS_FLOATING=true
            fi

            if [ "$IS_FLOATING" = true ]; then
              echo "::warning title=Floating tag detected::Image '$IMAGE_REF' uses a floating tag ('$TAG'). Consider pinning to a specific version or digest."
            fi

            DEST="ghcr.io/tgmarius/mirror/${NAME}:${TAG}"
            echo "DEST: '$DEST'"

            echo "Pulling $IMAGE_REF..."
            docker pull "$IMAGE_REF"

            echo "Tagging as $DEST..."
            docker tag "$IMAGE_REF" "$DEST"

            echo "Pushing to GHCR..."
            docker push "$DEST"

            echo "Done processing $IMAGE_REF"
            echo "----"

          done < images.txt

          echo "Mirroring complete!"
