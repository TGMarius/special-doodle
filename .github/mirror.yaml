name: Mirror Images to GHCR

on:
  push:
    paths:
      - "images.txt"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Mirror all images
        run: |
          while read SRC; do
            [ -z "$SRC" ] && continue

            NAME=$(basename "$SRC")
            TAG=$(echo "$SRC" | sed 's/.*://')
            DEST="ghcr.io/mariustugulea/mirror/${NAME}:${TAG}"

            echo "Mirroring $SRC → $DEST"

            docker pull "$SRC"
            docker tag "$SRC" "$DEST"
            docker push "$DEST"
          done < images.txt
